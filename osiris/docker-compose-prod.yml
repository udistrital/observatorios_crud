version: '3.8'

services:
  web:
    tty: true
    build: .
    container_name: web
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    command: >
      sh -c "python manage.py migrate &&
             gunicorn --worker-class gthread --workers 2 --threads 4
             --timeout 240 --graceful-timeout 20
             --bind 0.0.0.0:8000 osiris.wsgi:application"
    networks:
      - backend

networks:
  backend:
    driver: bridge
