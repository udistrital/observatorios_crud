components:
  parameters:
    Version:
      name: version
      in: path
      required: true
      description: Segmento libre; el código no restringe valores. El cliente usa v1.
      schema: {type: string, minLength: 1}
      example: v1
    Id:
      name: id
      in: path
      required: true
      schema: {type: string}
    EstructuraId:
      name: estructura_id
      in: path
      required: true
      description: Nombre/ID del índice dinámico de estructura.
      schema: {type: string}
    RegistroId:
      name: registro_id
      in: path
      required: true
      description: Posición decimal actual dentro del arreglo data; no es estable.
      schema: {type: integer, minimum: 0}
    DashboardId:
      name: dashboard_id
      in: path
      required: true
      schema: {type: string}
    ProcesoIdQuery:
      name: proceso_id
      in: query
      required: false
      schema: {type: string}
    FactorIdQuery:
      name: factor_id
      in: query
      required: false
      schema: {type: string}
    CaracteristicaIdQuery:
      name: caracteristica_id
      in: query
      required: false
      schema: {type: string}
    AspectoIdQuery:
      name: aspecto_id
      in: query
      required: false
      schema: {type: string}
    Page:
      name: page
      in: query
      required: false
      schema: {type: integer, minimum: 1, default: 1}
    PageSize:
      name: page_size
      in: query
      required: false
      description: El código no impone máximo.
      schema: {type: integer, minimum: 1, default: 10}
    Ordering:
      name: ordering
      in: query
      required: false
      description: Nombre de campo o prefijo menos para descendente.
      schema: {type: string}
    AuthorizationSyntax:
      name: Authorization
      in: header
      required: true
      description: Solo se exige la forma Bearer con texto; no se valida el token.
      schema: {type: string, pattern: '^Bearer .+$'}

  requestBodies:
    GenericObject:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AnyObject'}
    ProcesoCreate:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ProcesoCreate'}
    FactorCreate:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/FactorCreate'}
    CaracteristicaCreate:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/CaracteristicaCreate'}
    AspectoCreate:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AspectoCreate'}
    EstructuraCreate:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/EstructuraCreate'}
    EstructuraCamposUpdate:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/EstructuraCamposUpdate'}
    RegistroCreate:
      required: true
      content:
        application/json:
          schema:
            oneOf:
              - {$ref: '#/components/schemas/RegistroValores'}
              - {$ref: '#/components/schemas/AnyObject'}
    RegistroPatch:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties: {activo: {type: boolean}}
    DashboardCreate:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/DashboardCreate'}
    GraficoCreate:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/GraficoCreate'}
    LegacyData:
      required: true
      content:
        application/json: {schema: {$ref: '#/components/schemas/AnyObject'}}
        multipart/form-data:
          schema:
            type: object
            properties:
              formato: {type: string, enum: [FORM, CSV, JSON]}
              archivo: {type: string, format: binary}

  responses:
    Object200:
      description: Objeto JSON según el recurso
      content: {application/json: {schema: {$ref: '#/components/schemas/AnyObject'}}}
    Array200:
      description: Arreglo JSON sin envoltura de paginación
      content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/AnyObject'}}}}
    Paginated200:
      description: Página manual de registros embebidos
      content: {application/json: {schema: {$ref: '#/components/schemas/Paginated'}}}
    Object201:
      description: Recurso creado
      content: {application/json: {schema: {$ref: '#/components/schemas/AnyObject'}}}
    ObjectOrNull201:
      description: Recurso creado; el modelo de dashboard puede producir cuerpo nulo
      content: {application/json: {schema: {oneOf: [{$ref: '#/components/schemas/AnyObject'}, {type: 'null'}]}}}
    Empty204: {description: Operación completada sin cuerpo}
    Error400: {$ref: '#/components/responses/ErrorGeneric400'}
    ErrorGeneric400:
      description: Solicitud o validación inválida; forma no uniforme
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorVariant'}}}
    Error401:
      description: Header Bearer ausente o sin texto
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorVariant'}}}
    Error404:
      description: Recurso no encontrado; forma no uniforme
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorVariant'}}}
    Error405:
      description: Método rechazado por el handler
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorVariant'}}}
    Error413:
      description: Límite de entrada, salida o expansión superado
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorVariant'}}}
    Error415:
      description: Extensión, MIME, firma o contenido Office rechazado
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorVariant'}}}
    Error422:
      description: Conversión o PDF resultante inválido
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorVariant'}}}
    Error429:
      description: Tasa excedida o conversor ocupado
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorVariant'}}}
    Error500:
      description: Error no controlado o de Elasticsearch; forma no uniforme
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorVariant'}}}
    Error503:
      description: LibreOffice o usuario de conversión no disponible
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorVariant'}}}
    Error504:
      description: Timeout de conversión
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorVariant'}}}

  schemas:
    AnyObject:
      type: object
      additionalProperties: true
      description: Esquema abierto porque el handler no define una respuesta estable completa.
    ErrorVariant:
      type: object
      additionalProperties: true
      description: Puede contener status, message, data, error, detalle o detail.
    Health:
      type: object
      required: [Status, Code]
      properties:
        Status: {type: string, const: Ok}
        Code: {type: integer, const: 200}
    ObservatorioCreate:
      type: object
      required: [nombre, descripcion, imagen]
      properties:
        nombre: {type: string}
        descripcion: {type: string}
        imagen: {type: string, format: binary}
        activo: {type: boolean}
    ObservatorioUpdate:
      type: object
      properties:
        nombre: {type: string}
        descripcion: {type: string}
        imagen: {type: string, format: binary}
        activo: {type: boolean}
    ProcesoCreate:
      type: object
      required: [nombre, fecha_inicio, fecha_fin]
      properties:
        nombre: {type: string}
        descripcion: {type: string}
        dependencia_responsable: {type: string}
        objetivo: {type: string}
        factores: {type: array, items: {type: string}}
        fecha_inicio: {type: string, description: YYYY-MM-DD o ISO 8601}
        fecha_fin: {type: string, description: YYYY-MM-DD o ISO 8601}
        orden: {type: integer, minimum: 0}
        activo: {type: boolean}
    FactorCreate:
      type: object
      required: [proceso_id, nombre]
      properties:
        proceso_id: {type: string}
        nombre: {type: string}
        descripcion: {type: string}
        calificacion: {type: number}
        caracteristicas: {type: array, items: {type: string}}
        orden: {type: integer, minimum: 0}
        activo: {type: boolean}
    CaracteristicaCreate:
      type: object
      required: [factor_id, nombre, descripcion]
      properties:
        factor_id: {type: string}
        nombre: {type: string}
        descripcion: {type: string}
        calificacion: {type: number}
        aspectos: {type: array, items: {type: string}}
        orden: {type: integer, minimum: 0}
        activo: {type: boolean}
    AspectoCreate:
      type: object
      required: [caracteristica_id, nombre]
      properties:
        caracteristica_id: {type: string}
        nombre: {type: string}
        estructuras_evidencias: {type: array, items: {$ref: '#/components/schemas/AnyObject'}}
        orden: {type: integer, minimum: 0}
        activo: {type: boolean}
    EstructuraCreate:
      type: object
      required: [aspecto_id, tipo_evidencia, nombre]
      properties:
        aspecto_id: {type: string}
        tipo_evidencia: {type: string, enum: [Documental, Tabla]}
        nombre: {type: string}
        campos: {type: array, items: {$ref: '#/components/schemas/Campo'}}
        data: {type: array, items: {$ref: '#/components/schemas/AnyObject'}}
        orden: {type: integer, minimum: 0}
        activo: {type: boolean}
    Campo:
      type: object
      properties:
        campo_id: {type: string}
        orden: {type: integer, minimum: 0}
        nombre_campo: {type: string}
        tipo_campo: {type: string}
        activo: {type: boolean}
        migrar_data: {type: boolean}
    EstructuraCamposUpdate:
      type: object
      properties:
        nombre: {type: string}
        orden: {type: integer, minimum: 0}
        activo: {type: boolean}
        campos: {type: array, items: {$ref: '#/components/schemas/Campo'}}
        data: {type: array, items: {$ref: '#/components/schemas/AnyObject'}}
        eliminar_data_campos: {type: array, items: {type: string}}
    RegistroValores:
      type: object
      required: [valores]
      properties:
        valores: {type: object, additionalProperties: true}
    Paginated:
      type: object
      required: [count, page, page_size, results]
      properties:
        count: {type: integer, minimum: 0}
        page: {type: integer, minimum: 1}
        page_size: {type: integer, minimum: 1}
        results: {type: array, items: {$ref: '#/components/schemas/AnyObject'}}
    DashboardCreate:
      type: object
      required: [nombre, descripcion, observatorio, columnas]
      properties:
        nombre: {type: string}
        descripcion: {type: string}
        observatorio: {type: string}
        columnas: {type: integer}
        activo: {type: boolean}
    GraficoCreate:
      type: object
      required: [nombre, descripcion, configuracion, columna, fila, estructura]
      properties:
        nombre: {type: string}
        descripcion: {type: string}
        configuracion: {type: object, additionalProperties: true}
        columna: {type: integer}
        fila: {type: integer}
        estructura: {type: string}
