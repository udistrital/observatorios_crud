      x-source: osiris/apps/observatorios/views.py:ObservatorioViewSet.retrieve
      x-verification: VERIFICADO
      responses:
        '200': {$ref: '#/components/responses/Object200'}
        '404': {$ref: '#/components/responses/Error404'}
        '500': {$ref: '#/components/responses/Error500'}
    put:
      tags: [Observatorios]
      operationId: updateObservatorio
      summary: Actualizar parcialmente un observatorio
      x-source: osiris/apps/observatorios/views.py:ObservatorioViewSet.update
      x-verification: VERIFICADO
