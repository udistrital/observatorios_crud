    2026-11-10. Contiene 33 rutas y 90 operaciones de dominio, más salud.
    No declara autenticación global porque no está configurada en DRF. Las
    extensiones `x-verification`, `x-source` y `x-runtime-status` distinguen
    evidencia y limitaciones. No es el Swagger 2 histórico de `swagger/`.
  license:
    name: GPL-3.0-or-later según README del repositorio
servers:
  - url: http://localhost:8000
    description: Ejemplo local, sin credenciales
tags:
  - name: Observatorios
  - name: Procesos
  - name: Factores
  - name: Características
  - name: Aspectos
  - name: Estructuras
  - name: Campos
  - name: Datos heredados
  - name: Dashboards
  - name: Gráficos
  - name: Constructor
  - name: Operación
paths:
  /health/:
