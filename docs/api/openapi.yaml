      tags: [Operación]
      operationId: getHealth
      summary: Comprobar liveness del proceso Django
      x-source: osiris/apps/utils/views.py:healthcheck
      x-verification: VERIFICADO
      description: No comprueba Elasticsearch, LibreOffice ni dependencias externas.
      responses:
        '200':
          description: Respuesta fija de salud
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
              example: {Status: Ok, Code: 200}

